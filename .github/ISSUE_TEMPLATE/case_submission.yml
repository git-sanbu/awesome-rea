name: "Submit a REA case / 投稿实践"
description: "Suggest public REA work with primary sources, results and limitations. Any supported language is welcome."
title: "[Case] "
body:
  - type: input
    id: title
    attributes:
      label: "Case name / 案例名称"
      placeholder: "What was analyzed with REA, and what was built?"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "Author and primary sources / 原作者与出处"
      description: "Link to the author's README, report, code or demo; identify the relevant section and preferably a fixed commit."
    validations:
      required: true
  - type: textarea
    id: rea_usage
    attributes:
      label: "Actual REA use and evidence / REA 使用证据"
      description: "Where does the primary source explicitly attribute work to morluto/rea? State the target, actual operations and work done by other tools."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: "Reported results / 公开成果"
      description: "What code, tests or demos are public? Distinguish author reports from independent reproduction."
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: "Limitations / 局限与未验证项"
      description: "Versions, failures, approximations, untested devices or unfinished features. Unknown is a valid answer."
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: "Public material / 公开材料"
      options:
        - label: "The links may be shared publicly. I have not attached secrets, private logs or target-software installers."
          required: true
