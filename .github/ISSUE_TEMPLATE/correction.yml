name: "Correct a case / 资料纠错"
description: "Correct attribution, translations, links, results or version status. Any supported language is welcome."
title: "[Correction] "
body:
  - type: input
    id: case
    attributes:
      label: "Case and language / 案例与语言"
      description: "Link to the affected case or translation."
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: "What needs to change? / 修改内容"
      description: "Link to a new primary source, commit or date; explain how it changes the old conclusion. For translation issues, quote the affected wording."
    validations:
      required: true
